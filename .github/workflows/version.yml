---
"on":
  schedule:
    # 18:00 on Friday
    - cron: 0 18 * * 5
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update version
        run:
          scripts/update-version.pl .github/workflows/version.yml README.md \
            .pre-commit-hooks.yaml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          tag_name: 0.11.0
